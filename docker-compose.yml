version: '3.8'

services:
  # Base node fork using Anvil
  anvil:
    build:
      context: ./integration-test/anvil
      dockerfile: Dockerfile.anvil
    container_name: x402-anvil
    ports:
      - "8545:8545"
    environment:
      - ANVIL_PORT=8545
      - ANVIL_HOST=0.0.0.0
    networks:
      - x402-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      anvil
      --host 0.0.0.0
      --port 8545
      --fork-url ${ANVIL_FORK_URL:-https://sepolia.base.org}
      --fork-block-number ${ANVIL_FORK_BLOCK:-latest}
      --chain-id 84532
      --accounts 10
      --balance 10000

  # Redis for facilitator storage
  redis:
    image: redis:7-alpine
    container_name: x402-redis
    ports:
      - "6379:6379"
    networks:
      - x402-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Combined services image (backend + facilitator)
  # Using a single image reduces build time by sharing dependencies
  # Optimized for caching: dependencies are built separately from source
  facilitator:
    build:
      context: .
      dockerfile: integration-test/Dockerfile.services
      # Enable BuildKit cache for faster rebuilds
      # Use: COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 docker-compose build
    container_name: x402-facilitator
    ports:
      - "4020:4020"
    environment:
      - SERVICE=facilitator
      - BIND_ADDRESS=0.0.0.0:4020
      - PORT=4020
      - STORAGE_BACKEND=redis
      - REDIS_URL=redis://redis:6379
      - REDIS_KEY_PREFIX=x402:nonce
      - NETWORK=base-sepolia
    networks:
      - x402-network
    depends_on:
      redis:
        condition: service_healthy
      anvil:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4020/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Axum server (using same image as facilitator)
  # Shares build cache with facilitator for faster builds
  backend:
    build:
      context: .
      dockerfile: integration-test/Dockerfile.services
      # Same image as facilitator, just different SERVICE env var
    container_name: x402-backend
    ports:
      - "4021:4021"
    environment:
      - SERVICE=backend
      - PORT=4021
      - FACILITATOR_URL=http://facilitator:4020
      - RPC_URL=http://anvil:8545
      - NETWORK=base-sepolia
    networks:
      - x402-network
    depends_on:
      facilitator:
        condition: service_healthy
      anvil:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4021/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend web application
  frontend:
    build:
      context: ./integration-test/frontend
      dockerfile: Dockerfile.frontend
    container_name: x402-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:4021
      - FACILITATOR_URL=http://facilitator:4020
      - RPC_URL=http://anvil:8545
    networks:
      - x402-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  x402-network:
    driver: bridge
