name: Docker Integration Tests

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  docker-integration-test:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker services
        run: |
          docker-compose up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 2; done' || true

      - name: Wait for services health checks
        run: |
          echo "Waiting for all services to be healthy..."
          for i in {1..60}; do
            if curl -f http://localhost:4021/health > /dev/null 2>&1 && \
               curl -f http://localhost:4020/health > /dev/null 2>&1; then
              echo "All services are healthy!"
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 2
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Docker integration tests
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug
        run: |
          cargo test --test docker_integration_test --features axum,redis -- --nocapture --test-threads=1
        continue-on-error: false

      - name: Check service logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker-compose logs backend || true
          echo "=== Facilitator logs ==="
          docker-compose logs facilitator || true
          echo "=== Anvil logs ==="
          docker-compose logs anvil || true
          echo "=== Redis logs ==="
          docker-compose logs redis || true

      - name: Stop Docker services
        if: always()
        run: |
          docker-compose down -v

